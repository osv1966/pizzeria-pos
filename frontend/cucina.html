<body>
    <h1>🍕 CUCINA</h1>
    <div class="barra-data-ora"><span id="giorno-ora">Caricamento...</span></div>
    
        <div class="stats">
        <div class="stat-card">⏳ In attesa<br><span id="stat-attesa">0</span></div>
        <div class="stat-card">✅ Accettati<br><span id="stat-accettati">0</span></div>
        <div class="stat-card">🟠 Split<br><span id="stat-split">0</span></div>
        <div class="stat-card">🔴 Standby<br><span id="stat-standby">0</span></div>
    </div>   
        <div id="split-wrapper" style="display:none;">
        <div id="split-title-box"></div>
        <div id="split-container"></div>
    </div>
    <div id="standby-wrapper" style="display:none;">
        <div id="standby-title-box"></div>
        <div id="standby-container"></div>
    </div>    
    <div id="griglia-tavoli" class="griglia"></div>
    
    <div class="azione-panel" id="azione-panel">
        <div class="info-selezione" id="info-selezione">📋 Nessun tavolo selezionato</div>
            <div class="btn-group" id="btn-group-accetta" style="display:none;">
            <button class="btn btn-verde" onclick="accettaTavolo()">✅ ACCETTA</button>
            <button class="btn btn-rosso" onclick="declinaTavolo()">❌ DECLINA</button>
            <button class="btn btn-grigio" onclick="annulla()">ANNULLA</button>
        </div>

  
        <div class="btn-group" id="btn-group-main">
            <button class="btn btn-verde" onclick="cambiaStato('pronto')">✅ PRONTO</button>
            <button class="btn btn-arancio" onclick="mostraTempi()">⏱️ IN LAVORAZIONE</button>
            <button class="btn btn-rosso" onclick="cambiaStato('non_disponibile')">❌ NON DISP.</button>
            <button class="btn btn-grigio" onclick="annulla()">ANNULLA</button>
        </div>
        <div id="tempi-buttons" class="tempi-panel">
            <div class="btn-group">
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(10)">10 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(20)">20 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(30)">30 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(45)">45 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(60)">60 min</button>
                <button class="btn btn-grigio" onclick="nascondiTempi()">◀ Indietro</button>
            </div>
        </div>
    </div>

    <script>
        let API_URL = 'http://' + window.location.hostname + ':3000';
        let tavoloSelezionato = null;
        let tavoliCorrenti = [];
        let repartoAperto = false;
        let voceAttiva = true;
        let annunciati = {};
        
        let voceScelta = null;

function trovaVoceFemminile() {
    const voci = speechSynthesis.getVoices();
    if(!voci || voci.length === 0) return null;
    const preferite = ['Elsa', 'Isabella', 'Alice', 'Federica', 'Female', 'Donna'];
    for(let nome of preferite) {
        const v = voci.find(x => x.lang.startsWith('it') && x.name.toLowerCase().includes(nome.toLowerCase()));
        if(v) return v;
    }
    return voci.find(x => x.lang.startsWith('it')) || null;
}

if('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => { voceScelta = trovaVoceFemminile(); };
    voceScelta = trovaVoceFemminile();
}

function parla(testo) {
    if(!voceAttiva) return;
    if(!('speechSynthesis' in window)) return;
    let msg = new SpeechSynthesisUtterance(testo);
    msg.lang = 'it-IT';
    msg.rate = 0.95;
    msg.pitch = 1.4;
    msg.volume = 1.0;
    if(!voceScelta) voceScelta = trovaVoceFemminile();
    if(voceScelta) msg.voice = voceScelta;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(msg);
}
        
        function calcolaMinutiRimasti(ultimoAggiornamento, minutiTotali) {
            if(!minutiTotali) return 0;
            if(!ultimoAggiornamento) return minutiTotali;
            let inizio = new Date(ultimoAggiornamento);
            let fine = new Date(inizio.getTime() + minutiTotali * 60000);
            let ora = new Date();
            let rimasti = Math.ceil((fine - ora) / 60000);
            return rimasti > 0 ? rimasti : 0;
        }
        
                async function carica() {
                if(repartoAperto) return;
            try {
                let res = await fetch(API_URL + '/api/stati-completi');
                let tavoli = await res.json();
                tavoliCorrenti = tavoli;

                let htmlNormali = '';
                let htmlSplit = '';
                let htmlStandby = '';
                let attesa = 0, accettati = 0;

                let listaNormali = [];
                let listaSplit = [];
                let listaStandby = [];

                // SEPARA IN 3 GRUPPI
                for(let t of tavoli) {
                    let p = t.pizzeria_stato;
                    let c = t.cucina_stato;

                    // STANDBY: entrambi declinato
                    if(p === 'declinato' && c === 'declinato') {
                        listaStandby.push(t);
                        continue;
                    }
                                    // SPLIT: solo se ENTRAMBI hanno agito E sono diversi
                let pHaAgito = (p === 'accettato' || p === 'declinato');
                let cHaAgito = (c === 'accettato' || c === 'declinato');
                if(pHaAgito && cHaAgito && p !== c) {
                    listaSplit.push(t);
                    continue;
                }
                                        
                    // NORMALI: entrambi in attesa o entrambi accettato
                    listaNormali.push(t);
                    if(!(p === 'accettato' && c === 'accettato')) attesa++;
                    if(p === 'accettato' && c === 'accettato') accettati++;
                }

                // COSTRUISCI CARD NORMALI
                for(let t of listaNormali) {
                    htmlNormali += costruisciCard(t, 'normale');
                }

                // COSTRUISCI CARD SPLIT
                for(let t of listaSplit) {
                    htmlSplit += costruisciCard(t, 'split');
                }

                // ORDINA STANDBY per data_declino (più vecchio in alto)
                listaStandby.sort((a, b) => {
                    let dataA = a.pizzeria_data_declino || a.cucina_data_declino;
                    let dataB = b.pizzeria_data_declino || b.cucina_data_declino;
                    if(!dataA) return 1;
                    if(!dataB) return -1;
                    return new Date(dataA) - new Date(dataB);
                });

                // COSTRUISCI CARD STANDBY
                for(let t of listaStandby) {
                    htmlStandby += costruisciCard(t, 'standby');
                }

                // POPOLA I CONTENITORI
                document.getElementById('griglia-tavoli').innerHTML = htmlNormali;

                if(listaSplit.length > 0) {
                                    document.getElementById('split-title-box').innerHTML = '🟠 TAVOLI IN SPLIT (' + listaSplit.length + ')';
                    document.getElementById('split-container').innerHTML = htmlSplit;
                    document.getElementById('split-wrapper').style.display = 'block';                    
                   
                } else {
                    document.getElementById('split-wrapper').style.display = 'none';
                }

                if(listaStandby.length > 0) {
                                       document.getElementById('standby-title-box').innerHTML = '🔴 TAVOLI IN STANDBY (' + listaStandby.length + ')';
                    document.getElementById('standby-container').innerHTML = htmlStandby;
                    document.getElementById('standby-wrapper').style.display = 'block';                    
                } else {
                    document.getElementById('standby-wrapper').style.display = 'none';
                }

                document.getElementById('stat-attesa').innerText = attesa;
                document.getElementById('stat-accettati').innerText = accettati;
                document.getElementById('stat-split').innerText = listaSplit.length;
                document.getElementById('stat-standby').innerText = listaStandby.length;                
            } catch(e) { console.error(e); }
        }        
                    function costruisciCard(t, tipo) {
            let tavoloId = t.tavolo_id;
            let c = t.cucina_stato;   
            let p = t.pizzeria_stato;
            let f = t.friggitoria_stato;

            // Classe della card
            let cardClass = 'tavolo-card-nuovo';
            if(tipo === 'split') cardClass = 'tavolo-card-split';
            if(tipo === 'standby') cardClass = 'tavolo-card-standby';
            if(tipo === 'normale' && p === 'accettato' && c === 'accettato') {
                cardClass += ' tavolo-verde';
            } else if(tipo === 'normale' && p === 'in_attesa' && c === 'in_attesa') {
                cardClass += ' tavolo-grigio';
            }
            
            // Controlla se la CUCINA ha ripreso di recente (entro 10 minuti)
            let oraAttuale = new Date();
            let dieciMinutiFa = new Date(oraAttuale.getTime() - 10 * 60 * 1000);
            
            if(t.cucina_data_ripresa) {
                let dRip = new Date(t.cucina_data_ripresa);
                if(dRip > dieciMinutiFa) cardClass += ' tavolo-ripreso';
            }
            
            // Riga Pizzeria
            let classP = 'reparto-riga pizzeria';
            let testoP = '🍕 PIZZERIA — ⏳ Attesa';
            if(p === 'accettato') { classP += ' accettato'; testoP = '🍕 PIZZERIA — ✅ Accettato'; }
            else if(p === 'declinato') { classP += ' declinato'; testoP = '🍕 PIZZERIA — ❌ Declinato'; }
            

            let rigaP = '<div class="' + classP + '">' + testoP + '</div>';

            // Riga Cucina
            let classC = 'reparto-riga cucina';
            let testoC = '👨‍🍳 CUCINA — ⏳ Attesa';
            if(c === 'accettato') { classC += ' accettato'; testoC = '👨‍🍳 CUCINA — ✅ Accettato'; }
            else if(c === 'declinato') { classC += ' declinato'; testoC = '👨‍🍳 CUCINA — ❌ Declinato'; }
            
            let btnRiprendiC = '';
            if(tipo === 'standby' && c === 'declinato') {
                btnRiprendiC = '<button class="btn-riprendi-inline" onclick="event.stopPropagation(); riprendi(' + tavoloId + ', \'cucina\')">↩️ RIPRENDI</button>';
            } else if(tipo === 'split' && c === 'declinato') {
                btnRiprendiC = '<button class="btn-riprendi-inline" onclick="event.stopPropagation(); riprendi(' + tavoloId + ', \'cucina\')">↩️ RIPRENDI</button>';
            }

            let rigaC = '<div class="' + classC + '" onclick="clickReparto(' + tavoloId + ', \'cucina\')">' + testoC + btnRiprendiC + '</div>';
            
                        // Riga Friggitoria
            let classF = 'reparto-riga friggitoria';
            let testoF = '🍟 FRIGGITORIA — ⏳ Attesa';
            if(f === 'accettato') { classF += ' accettato'; testoF = '🍟 FRIGGITORIA — ✅ Accettato'; }
            else if(f === 'declinato') { classF += ' declinato'; testoF = '🍟 FRIGGITORIA — ❌ Declinato'; }

            let rigaF = '<div class="' + classF + '">' + testoF + '</div>';
                                                                 
            // Orario declino (per STANDBY e SPLIT)
            let orarioDeclino = '';
            if(tipo === 'standby' || tipo === 'split') {
                let dataDeclino = t.pizzeria_data_declino || t.cucina_data_declino;
                if(dataDeclino) {
                    let d = new Date(dataDeclino);
                    let hh = String(d.getHours()).padStart(2,'0');
                    let mm = String(d.getMinutes()).padStart(2,'0');
                    orarioDeclino = '<div class="standby-orario">📅 ' + hh + ':' + mm + '</div>';
                }
            }

            return '<div class="' + cardClass + '">' +
                   '<div class="tavolo-numero-nuovo">🍽️ Tavolo ' + tavoloId + '</div>' +
                   rigaC + rigaP + rigaF +
                   orarioDeclino +
                   '</div>';
        }
            
            function clickReparto(tavoloId, reparto) {
            repartoAperto = true;
            // Trova la card del tavolo
            let card = event.target.closest('.tavolo-card-nuovo, .tavolo-card-split, .tavolo-card-standby');
            if(!card) return;

            // Rimuovi eventuali pulsanti già aperti
            let esistenti = card.querySelectorAll('.reparto-bottoni');
            esistenti.forEach(e => e.remove());

            // Controlla se i pulsanti sono già aperti per questa riga
            let rigaCliccata = event.target.closest('.reparto-riga');
            if(!rigaCliccata) return;

            // Crea i pulsanti
            let bottoni = document.createElement('div');
            bottoni.className = 'reparto-bottoni';
            bottoni.innerHTML = 
                '<button class="btn-accetta-p" onclick="event.stopPropagation(); azioneReparto(' + tavoloId + ', \'' + reparto + '\', \'accetta\')">✅ ACCETTA</button>' +
                '<button class="btn-declina-p" onclick="event.stopPropagation(); azioneReparto(' + tavoloId + ', \'' + reparto + '\', \'declina\')">❌ DECLINA</button>';

            // Inserisci sotto la riga cliccata
            rigaCliccata.parentNode.insertBefore(bottoni, rigaCliccata.nextSibling);
        }

        async function azioneReparto(tavoloId, reparto, azione) {
            let endpoint = '';
            if(reparto === 'cucina') {
                endpoint = azione === 'accetta' ? '/api/cucina-accetta/' : '/api/cucina-declina/';
            } else {
                console.log('Reparto non gestito ancora:', reparto);
                return;
            }
             
            try {
                await fetch(API_URL + endpoint + tavoloId, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'}
                });
                repartoAperto = false;
                carica();
            } catch(e) {
                console.error('Errore azione:', e);
            }
        }
            
                async function riprendi(id, reparto) {
            if(!confirm('Riprendere il tavolo ' + id + '?')) return;
            repartoAperto = false;
            try {
                await fetch(API_URL + '/api/cucina-accetta/' + id, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'}
                });
                carica();
            } catch(e) { console.error(e); }
        }          
                function seleziona(id) {
            tavoloSelezionato = id;
            document.getElementById('info-selezione').innerHTML = `📋 Tavolo ${id} selezionato`;
            document.getElementById('azione-panel').style.display = 'block';
            document.getElementById('tempi-buttons').style.display = 'none';

            // Trova il tavolo selezionato
            let tavolo = tavoliCorrenti.find(t => t.tavolo_id === id);
            
            // Nascondi entrambi i gruppi
            document.getElementById('btn-group-main').style.display = 'none';
            document.getElementById('btn-group-accetta').style.display = 'none';

            if(tavolo) {
                // Se non è ancora accettato → mostra ACCETTA/DECLINA
                if(tavolo.stato_cassa !== 'accettato' && tavolo.stato_cassa !== 'declinato') {
                    document.getElementById('btn-group-accetta').style.display = 'flex';
                } else {
                    // Se accettato → mostra PRONTO/IN LAVORAZIONE/NON DISP.
                    document.getElementById('btn-group-main').style.display = 'flex';
                }
            }
            carica();
        }
                   
        function mostraTempi() {
            document.getElementById('btn-group-main').style.display = 'none';
            document.getElementById('tempi-buttons').style.display = 'block';
        }
        
        function nascondiTempi() {
            document.getElementById('btn-group-main').style.display = 'flex';
            document.getElementById('tempi-buttons').style.display = 'none';
        }
        
        async function cambiaStato(stato) {
            if(!tavoloSelezionato) return;
            await fetch(API_URL + '/api/stati-pizzeria/' + tavoloSelezionato, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({stato: stato, tempo_minuti: null})
            });
            if(stato === 'pronto') parla(`Tavolo ${tavoloSelezionato}, pronto`);
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        async function accettaTavolo() {
            if(!tavoloSelezionato) return;
            await fetch(API_URL + '/api/cassa-rispondi-pizzeria/' + tavoloSelezionato, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({azione: 'accetta'})
            });
            parla(`Tavolo ${tavoloSelezionato}, accettato`);
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }

        async function declinaTavolo() {
            if(!tavoloSelezionato) return;
            await fetch(API_URL + '/api/cassa-rispondi-pizzeria/' + tavoloSelezionato, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({azione: 'declina'})
            });
            parla(`Tavolo ${tavoloSelezionato}, declinato`);
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        async function lavorazioneConTempo(minuti) {
            if(!tavoloSelezionato) return;
            await fetch(API_URL + '/api/stati-pizzeria/' + tavoloSelezionato, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({stato: 'lavorazione', tempo_minuti: minuti})
            });
            parla(`Tavolo ${tavoloSelezionato}, lavoro ${minuti} minuti`);
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        function annulla() {
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        carica();
        setInterval(carica, 3000);
        
        // === GIORNO E ORA ===
        function aggiornaGiornoOra() {
            const giorni = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
            const ora = new Date();
            const giorno = giorni[ora.getDay()];
            const hh = String(ora.getHours()).padStart(2, '0');
            const mm = String(ora.getMinutes()).padStart(2, '0');
            const el = document.getElementById('giorno-ora');
            if (el) el.textContent = '📅 ' + giorno + ' | 🕐 ' + hh + '.' + mm;
        }
        aggiornaGiornoOra();
        setInterval(aggiornaGiornoOra, 1000);
      
        // === MODALE FRITTINI ===
        let frittiniCorrenti = {};
        let tavoloFrittiniCorrente = null;

        async function apriModaleFrittini(tavoloId) {
            tavoloFrittiniCorrente = tavoloId;
            frittiniCorrenti = {};
            
            // Imposta il numero del tavolo nella modale
            document.getElementById('modale-tavolo').innerText = tavoloId;
            document.getElementById('modale-messaggio').innerText = '';
            
            // Carica il menu dal DB
            try {
                let res = await fetch(API_URL + '/api/menu-frittini');
                let menu = await res.json();
                
                // Carica i frittini già ordinati per questo tavolo
                let resF = await fetch(API_URL + '/api/stati-completi');
                let tutti = await resF.json();
                let tavolo = tutti.find(t => t.tavolo_id === tavoloId);
                
                if(tavolo && tavolo.friggitoria_prodotti) {
                    try {
                        let prodotti = JSON.parse(tavolo.friggitoria_prodotti);
                        prodotti.forEach(p => {
                            frittiniCorrenti[p.prodotto] = p.quantita;
                        });
                    } catch(e) {}
                }
                
                // Costruisci la lista
                let html = '';
                menu.forEach(m => {
                    let qty = frittiniCorrenti[m.nome] || 0;
                    html += '<div class="modale-riga">' +
                                '<div class="nome">🍟 ' + m.nome + '</div>' +
                                '<div class="controlli">' +
                                    '<button class="btn-qty" onclick="cambiaQtyFrittino(\'' + m.nome + '\', -1)">−</button>' +
                                    '<div class="qty-valore" id="qty-' + m.id + '">' + qty + '</div>' +
                                    '<button class="btn-qty" onclick="cambiaQtyFrittino(\'' + m.nome + '\', 1)">+</button>' +
                                '</div>' +
                            '</div>';
                });
                document.getElementById('modale-lista').innerHTML = html;
                
                // Apri modale
                document.getElementById('modale-frittini').classList.add('aperta');
                repartoAperto = true; // Blocca aggiornamento automatico
            } catch(e) {
                console.error('Errore apertura modale:', e);
                document.getElementById('modale-messaggio').innerText = 'Errore di caricamento';
            }
        }

        function cambiaQtyFrittino(nome, delta) {
            if(!frittiniCorrenti[nome]) frittiniCorrenti[nome] = 0;
            frittiniCorrenti[nome] += delta;
            if(frittiniCorrenti[nome] < 0) frittiniCorrenti[nome] = 0;
            
            // Aggiorna la visualizzazione
            let menu = document.querySelectorAll('.modale-riga');
            menu.forEach(riga => {
                let nomeRiga = riga.querySelector('.nome').innerText.replace('🍟 ', '');
                if(nomeRiga === nome) {
                    riga.querySelector('.qty-valore').innerText = frittiniCorrenti[nome];
                }
            });
        }

        async function confermaFrittini() {
            // Controlla che ci sia almeno un frittino selezionato
            let prodotti = [];
            for(let nome in frittiniCorrenti) {
                if(frittiniCorrenti[nome] > 0) {
                    prodotti.push({prodotto: nome, quantita: frittiniCorrenti[nome]});
                }
            }
            
            
            try {
                await fetch(API_URL + '/api/friggitoria-aggiungi-frittini/' + tavoloFrittiniCorrente, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prodotti: prodotti})
                });
                chiudiModaleFrittini();
                carica();
            } catch(e) {
                console.error('Errore conferma:', e);
                document.getElementById('modale-messaggio').innerText = 'Errore di salvataggio';
            }
        }
        
        
        async function eliminaTuttiFrittini() {
            if(!confirm('Eliminare TUTTI i frittini del tavolo ' + tavoloFrittiniCorrente + '?')) return;
            
            try {
                await fetch(API_URL + '/api/friggitoria-aggiungi-frittini/' + tavoloFrittiniCorrente, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prodotti: []})
                });
                chiudiModaleFrittini();
                carica();
            } catch(e) {
                console.error('Errore eliminazione:', e);
                document.getElementById('modale-messaggio').innerText = 'Errore di eliminazione';
            }
        }
        function chiudiModaleFrittini() {
            document.getElementById('modale-frittini').classList.remove('aperta');
            repartoAperto = false; // Sblocca aggiornamento automatico
            tavoloFrittiniCorrente = null;
            frittiniCorrenti = {};
        }
 
</script>

    <!-- === MODALE FRITTINI === -->
    <div id="modale-frittini" class="modale-frittini">
        <div class="modale-content">
            <div class="modale-header">
                <h2>🍟 FRITTINI - Tavolo <span id="modale-tavolo">-</span></h2>
                <button class="modale-close" onclick="chiudiModaleFrittini()">✕</button>
            </div>
            <div id="modale-lista" class="modale-lista">
                <!-- Lista prodotti caricata dal DB -->
            </div>
            <div id="modale-messaggio" class="modale-messaggio"></div>
            <div class="modale-footer">
                <button class="btn-conferma" onclick="confermaFrittini()">✅ CONFERMA</button>
                <button class="btn-elimina" onclick="eliminaTuttiFrittini()">🗑️ ELIMINA TUTTO</button>
                <button class="btn-annulla" onclick="chiudiModaleFrittini()">❌ ANNULLA</button>
            </div>
        </div>
    </div>
