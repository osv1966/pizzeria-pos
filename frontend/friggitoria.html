<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Friggitoria</title>
    <style>
        *{box-sizing:border-box}
        body{background:#2c3e50;padding:15px;margin:0;font-family:'Segoe UI',Arial}
        h1{color:#ff6b00;text-align:center;margin:0 0 15px 0}
        .stats{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
        .stat-card{background:#34495e;padding:8px 15px;border-radius:20px;color:white;text-align:center}
        .stat-card span{font-size:24px;font-weight:bold;display:block}
        .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
        .tavolo{border-radius:16px;padding:12px 5px;text-align:center;cursor:pointer;border:2px solid transparent;background:#3498db;color:white;transition:0.1s}
        .tavolo.selected{border-color:#ff6b00;background:#3d566e}
        .tavolo.accettato{border:4px solid #00ff00 !important;box-shadow:0 0 15px rgba(0,255,0,0.5)}
        .tavolo.lavoro-bg{background:#fd7e14}
        .tavolo.pronto-bg{background:#28a745}
        .numero{font-size:20px;font-weight:bold}
        .stato{font-size:12px;margin-top:5px}
        .tempo{font-size:10px;color:#ffd966;margin-top:3px;font-weight:bold}
        .badge-accettato{background:#28a745;color:white;padding:4px 8px;border-radius:12px;font-size:11px;margin-top:5px;display:inline-block}
        .frigg-container{background:#34495e;border-radius:16px;padding:15px;margin-top:20px;text-align:center}
        .frigg-btn{background:#fd7e14;color:white;border:none;border-radius:30px;padding:10px 16px;margin:5px;font-size:14px;font-weight:bold;cursor:pointer}
        .azione-panel{position:fixed;bottom:0;left:0;right:0;background:#34495e;padding:15px;display:none;z-index:1000;border-top:2px solid #ff6b00}
        .btn-group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .btn{padding:12px 20px;border:none;border-radius:40px;font-size:16px;font-weight:bold;cursor:pointer;flex:1;min-width:90px}
        .btn-verde{background:#28a745;color:white}
        .btn-arancio{background:#fd7e14;color:white}
        .btn-rosso{background:#dc3545;color:white}
        .btn-grigio{background:#6c757d;color:white}
        .btn-tempo{background:#17a2b8;color:white}
        .tempi-panel{display:none;margin-top:12px}
        .info-selezione{color:#ddd;text-align:center;margin-bottom:12px}
.declinato-bg {
    background: #3d1a1a !important;
    border: 3px solid #ff0000 !important;
    opacity: 0.8;
}
.badge-declinato {
    color: #ff4444;
    font-weight: bold;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    background: #2d1a1a;
    display: inline-block;
    border: 1px solid #ff4444;
    margin-top: 4px;
}
    </style>
</head>
<body>
    <h1>🍟 FRIGGITORIA</h1>
    
    <div class="stats">
        <div class="stat-card">⏳ In attesa<br><span id="stat-attesa">0</span></div>
        <div class="stat-card">🔧 In lavoro<br><span id="stat-lavoro">0</span></div>
        <div class="stat-card">✅ Pronti<br><span id="stat-pronti">0</span></div>
    </div>
    
    <div id="griglia-tavoli" class="griglia"></div>
    
    <div class="frigg-container">
        <h3 style="color:#fd7e14; margin:0 0 15px 0;">🍟 FRITTINI VELOCI</h3>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px;">
            <button class="frigg-btn" onclick="aggiungiProdotto('Patatine',1)">🍟 Patatine x1</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Patatine',2)">🍟 Patatine x2</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Patatine',3)">🍟 Patatine x3</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Crocchette',1)">🍡 Crocchette x1</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Crocchette',2)">🍡 Crocchette x2</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Crocchette',3)">🍡 Crocchette x3</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Panzerotto',1)">🥟 Panzerotto x1</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Panzerotto',2)">🥟 Panzerotto x2</button>
            <button class="frigg-btn" onclick="aggiungiProdotto('Panzerotto',3)">🥟 Panzerotto x3</button>
        </div>
    </div>
    
    <div class="azione-panel" id="azione-panel">
        <div class="info-selezione" id="info-selezione">📋 Nessun tavolo selezionato</div>
        <div class="btn-group" id="btn-group-main">
            <button class="btn btn-verde" onclick="cambiaStato('pronto')">✅ PRONTO</button>
            <button class="btn btn-arancio" onclick="mostraTempi()">⏱️ IN LAVORAZIONE</button>
            <button class="btn btn-rosso" onclick="cambiaStato('non_disponibile')">❌ NON DISP.</button>
            <button class="btn btn-grigio" onclick="annulla()">ANNULLA</button>
        </div>
        <div id="tempi-buttons" class="tempi-panel">
            <div class="btn-group">
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(5)">5 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(10)">10 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(15)">15 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(20)">20 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(25)">25 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(30)">30 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(35)">35 min</button>
                <button class="btn btn-tempo" onclick="lavorazioneConTempo(40)">40 min</button>
                <button class="btn btn-grigio" onclick="nascondiTempi()">◀ Indietro</button>
            </div>
        </div>
    </div>

    <script>
        let API_URL = 'http://192.168.1.80:3000';
        let tavoloSelezionato = null;
        let voceAttiva = true;
        let annunciati = {};
        let carrello = {};
        
        function parla(testo) {
            if(!voceAttiva) return;
            let msg = new SpeechSynthesisUtterance(testo);
            msg.lang = 'it-IT';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(msg);
        }
        
        function calcolaMinutiRimasti(ultimoAggiornamento, minutiTotali) {
            if(!minutiTotali) return 0;
            if(!ultimoAggiornamento) return minutiTotali;
            let inizio = new Date(ultimoAggiornamento);
            let fine = new Date(inizio.getTime() + minutiTotali * 60000);
            let ora = new Date();
            let rimasti = Math.ceil((fine - ora) / 60000);
            return rimasti > 0 ? rimasti : 0;
        }
        
        async function carica() {
    try {
        let res = await fetch(API_URL + '/api/stati-friggitoria');
        let tavoli = await res.json();
        let html = '';
        let attesa=0, lavoro=0, pronti=0;

        for(let t of tavoli) {
            let cls = '';
            let statoText = '';
            let tempoHtml = '';
            let badgeAccettato = '';
            let badgeDeclinato = '';  // ← AGGIUNGI
            let minRimasti = calcolaMinutiRimasti(t.ultimo_aggiornamento, t.tempo_minuti);

            // CONTROLLA PRIMA SE È DECLINATO ← AGGIUNGI
            if(t.stato_cassa === 'declinato') {
                cls = 'declinato-bg';
                statoText = '❌ DECLINATO';
                badgeDeclinato = '<div class="badge-declinato">❌ DECLINATO DALLA CASSA</div>';
            }
            else if(t.stato === 'lavorazione') {
                cls = 'lavoro-bg';
                statoText = '🔧 Lavoro';
                if(minRimasti > 0) tempoHtml = `<div class="tempo">⏱️ ${minRimasti} min</div>`;
                lavoro++;
            }
            else if(t.stato === 'pronto') {
                cls = 'pronto-bg';
                statoText = '✅ Pronto';
                pronti++;
                if(voceAttiva && !annunciati[`pronto_${t.tavolo_id}`]) {
                    annunciati[`pronto_${t.tavolo_id}`] = true;
                    parla(`Tavolo ${t.tavolo_id}, pronto`);
                }
            }
            else if(t.stato === 'non_disponibile') {
                cls = 'non-disponibile-bg';
                statoText = '❌ Non disp.';
            }
            else {
                cls = 'attesa-bg';
                statoText = '⏳ Attesa';
                attesa++;
            }

            if(t.stato_cassa === 'accettato') {
                cls += ' accettato';
                badgeAccettato = '<div class="badge-accettato">✅ Accettato</div>';
                if(voceAttiva && !annunciati[`accettato_${t.tavolo_id}`]) {
                    annunciati[`accettato_${t.tavolo_id}`] = true;
                    parla(`Tavolo ${t.tavolo_id}, ordine accettato`);
                }
            }

            let selected = (tavoloSelezionato === t.tavolo_id) ? 'selected' : '';
            let carrelloHtml = '';
            if(carrello[t.tavolo_id] && carrello[t.tavolo_id].length > 0) {
                carrelloHtml = `<div class="tempo" style="color:#ffd966;">🛒 ${carrello[t.tavolo_id].map(p => p.prodotto + ' x' + p.quantita).join(", ")}</div>`;
            } else if(t.prodotti) {
                try {
                    let prodottiArr = JSON.parse(t.prodotti);
                    let prodottiText = prodottiArr.map(p => p.prodotto + ' x' + p.quantita).join(', ');
                    carrelloHtml = `<div class="tempo" style="color:#ffd966;">🛒 ${prodottiText}</div>`;
                } catch(e) {}
            }
            html += `<div class="tavolo ${cls} ${selected}" onclick="seleziona(${t.tavolo_id})">
                        <div class="numero">🍽️ ${t.tavolo_id}</div>
                        <div class="stato">${statoText}</div>
                        ${tempoHtml}
                        ${badgeAccettato}
                        ${badgeDeclinato}  <!-- ← AGGIUNGI -->
                        ${carrelloHtml}
                    </div>`;
        }
        document.getElementById('griglia-tavoli').innerHTML = html;
        document.getElementById('stat-attesa').innerText = attesa;
        document.getElementById('stat-lavoro').innerText = lavoro;
        document.getElementById('stat-pronti').innerText = pronti;
    } catch(e) { console.error(e); }
}
        
        function seleziona(id) {
            tavoloSelezionato = id;
            document.getElementById('info-selezione').innerHTML = `📋 Tavolo ${id} selezionato`;
            document.getElementById('azione-panel').style.display = 'block';
            carica();
        }
        
        function aggiungiProdotto(prodotto, quantita) {
            if(!tavoloSelezionato) {
                alert("📌 Seleziona prima un tavolo!");
                return;
            }
            if(!carrello[tavoloSelezionato]) carrello[tavoloSelezionato] = [];
            carrello[tavoloSelezionato].push({prodotto, quantita});
            document.getElementById('info-selezione').innerHTML = `📋 Tavolo ${tavoloSelezionato} - 🛒 Carrello: ${carrello[tavoloSelezionato].map(p => p.prodotto + ' x' + p.quantita).join(", ")}`;
            carica();
        }
        
        function mostraTempi() {
            document.getElementById('btn-group-main').style.display = 'none';
            document.getElementById('tempi-buttons').style.display = 'block';
        }
        
        function nascondiTempi() {
            document.getElementById('btn-group-main').style.display = 'flex';
            document.getElementById('tempi-buttons').style.display = 'none';
        }
        
        async function cambiaStato(stato) {
            if(!tavoloSelezionato) return;
            await fetch(API_URL + '/api/stati-friggitoria/' + tavoloSelezionato, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({stato: stato, tempo_minuti: null})
            });
            if(stato === 'pronto') parla(`Tavolo ${tavoloSelezionato}, pronto`);
            delete carrello[tavoloSelezionato];
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        async function lavorazioneConTempo(minuti) {
            if(!tavoloSelezionato) return;
            
            let prodottiJson = null;
            if(carrello[tavoloSelezionato] && carrello[tavoloSelezionato].length > 0) {
                prodottiJson = JSON.stringify(carrello[tavoloSelezionato]);
            }
            
            await fetch(API_URL + '/api/stati-friggitoria/' + tavoloSelezionato, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    stato: 'lavorazione', 
                    tempo_minuti: minuti,
                    prodotti: prodottiJson
                })
            });
            parla(`In lavorazione FRIGGITORIA. Tavolo ${tavoloSelezionato}, lavoro ${minuti} minuti`);
            delete carrello[tavoloSelezionato];
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        function annulla() {
            delete carrello[tavoloSelezionato];
            tavoloSelezionato = null;
            document.getElementById('azione-panel').style.display = 'none';
            carica();
        }
        
        carica();
        setInterval(carica, 3000);
    </script>
</body>
</html>
