<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Ordini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e2a3a;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        h1 {
            color: #ff6b00;
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .toolbar {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #138496;
        }
        .storico-container {
            overflow-x: auto;
            border-radius: 16px;
            background: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }
        th {
            background: #34495e;
            color: #ff6b00;
            padding: 14px 12px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #3d566e;
            font-size: 13px;
        }
        .cucina { color: #3498db; font-weight: bold; }
        .pizzeria { color: #28a745; font-weight: bold; }
        .friggitoria { color: #fd7e14; font-weight: bold; }
        .empty {
            text-align: center;
            color: #999;
            padding: 50px;
            font-size: 16px;
        }
        .badge-accettato {
            background: #28a745;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
        }
        .badge-declinato {
            background: #dc3545;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>📜 STORICO ORDINI</h1>
    <div class="toolbar">
        <button class="btn" onclick="window.close()">◀ CHIUDI</button><button class="btn" onclick="cancellaStorico()" style="background:#dc3545; margin-left:10px;">🗑️ CANCELLA STORICO</button>
    </div>
    <div id="storico-container" class="storico-container"></div>

    <script>
        let API_URL = 'http://localhost:3000';
        
        async function caricaStorico() {
            try {
                let res = await fetch(API_URL + '/api/storico-accettati');
                let data = await res.json();
                
                if(data.length === 0) {
                    document.getElementById('storico-container').innerHTML = '<div class="empty">📭 Nessun ordine registrato</div>';
                    return;
                }
                
                let html = `<table>
                    <thead>
                        <tr>
                            <th>📅 Data e Ora</th>
                            <th>🍽️ Tavolo</th>
                            <th>🏷️ Reparto</th>
                            <th>✅ Azione</th>
                        </tr>
                    </thead>
                    <tbody>`;
                
                for(let s of data) {
                    let repartoClass = '';
                    let repartoIcon = '';
                    let repartoNome = '';
                    
                    if(s.reparto === 'cucina') { 
                        repartoClass = 'cucina'; 
                        repartoIcon = '🍳'; 
                        repartoNome = 'CUCINA';
                    } else if(s.reparto === 'pizzeria') { 
                        repartoClass = 'pizzeria'; 
                        repartoIcon = '🍕'; 
                        repartoNome = 'PIZZERIA';
                    } else if(s.reparto === 'friggitoria') { 
                        repartoClass = 'friggitoria'; 
                        repartoIcon = '🍟'; 
                        repartoNome = 'FRIGGITORIA';
                    } else {
                        repartoClass = '';
                        repartoIcon = '❓';
                        repartoNome = s.reparto || 'SCONOSCIUTO';
                    }
                    
                    let azioneText = s.azione === 'accettato' 
                        ? '<span class="badge-accettato">✅ ACCETTATO</span>' 
                        : '<span class="badge-declinato">❌ DECLINATO</span>';
                    
                    let dataFormattata = new Date(s.data_ora).toLocaleString('it-IT');
                    
                    html += `<tr>
                        <td>${dataFormattata}</td>
                        <td><strong>🍽️ ${s.tavolo_id}</strong></td>
                        <td class="${repartoClass}">${repartoIcon} ${repartoNome}</td>
                        <td>${azioneText}</td>
                    </tr>`;
                }
                
                html += `</tbody>
                <\/table>`;
                
                document.getElementById('storico-container').innerHTML = html;
            } catch(e) {
                console.error(e);
                document.getElementById('storico-container').innerHTML = '<div class="empty">❌ Errore caricamento storico</div>';
            }
        }
        
        caricaStorico();
            async function cancellaStorico() {
          if(confirm("⚠️ Sei sicuro? Cancellerai TUTTO lo storico degli ordini!")) {
            let res = await fetch(API_URL + '/api/cancella-storico', { method: 'POST' });
          if(res.ok) {
            alert("✅ Storico cancellato!");
            caricaStorico();
          } else {
            alert("❌ Errore durante la cancellazione");
        }
    }
}
    </script>
</body>
</html>
